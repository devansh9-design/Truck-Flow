line-length = 110
target-version = "py311"
extend-exclude = ["frontend", ".venv", "**/migrations"]  # migrations are generated by Django

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.isort]
known-first-party = ["api", "accounts", "geo", "routing", "scoring", "clients", "config", "truckrisk_schemas", "tests", "app", "rules"]
