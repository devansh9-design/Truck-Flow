[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truckrisk-schemas"
version = "0.1.0"
description = "Pydantic models shared by the Django API and the Flask risk engine."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools]
packages = ["truckrisk_schemas"]
