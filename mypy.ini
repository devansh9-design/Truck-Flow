# Light type checking of the core logic (I5). Run from each service folder:
#   cd backend && mypy --config-file ../mypy.ini routing scoring geo clients api
#   cd risk_engine && mypy --config-file ../mypy.ini rules.py weather.py evaluate.py heatmap.py app.py
[mypy]
python_version = 3.14
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
plugins = pydantic.mypy
exclude = (^|/)tests/
