# Render Blueprint: Django public API + Flask risk engine (see docs/deployment.md).
#
# No rootDir: both services install the shared schema package from ./shared, and Render
# makes files outside a service's rootDir unavailable. Commands therefore `cd` first.
# Free web services cannot receive private-network traffic, so Django reaches Flask over
# its public HTTPS URL, protected by the shared X-Internal-Token.
# One worker per service: the forecast/heatmap/geocode caches and rate-limit counters are
# in-process memory. Accounts and saved trips live in Render Postgres (ADR 012); Django
# applies migrations on start (one instance, so no race).

databases:
  - name: truck-routing-db
    plan: free # time-limited on Render's free tier: check Render's current terms
    region: oregon
    databaseName: truck_routing
    user: truck_routing

services:
  - type: web
    name: truck-risk-engine
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd risk_engine && pip install -r requirements.txt
    startCommand: cd risk_engine && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    buildFilter:
      paths:
        - risk_engine/**
        - shared/**
    envVars:
      - key: RISK_ENGINE_TOKEN
        sync: false # paste the same value into the Django service
      - key: NWS_USER_AGENT
        sync: false

  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - shared/**
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false # e.g. truck-routing-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://your-app.vercel.app (no trailing slash)
      - key: HERE_API_KEY
        sync: false
      - key: TRUCK_TARE_LB
        value: "35000"
      - key: RISK_ENGINE_URL
        sync: false # https://truck-risk-engine.onrender.com
      - key: RISK_ENGINE_TOKEN
        sync: false # same value as on truck-risk-engine
      - key: DATABASE_URL
        fromDatabase:
          name: truck-routing-db
          property: connectionString
      - key: NUM_PROXIES
        value: "1" # proxies appending to X-Forwarded-For; verify after deploy (docs/deployment.md)
