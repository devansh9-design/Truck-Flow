# I5: lint, type checks and every test suite on each push and pull request.
# No job calls a live third-party API: HERE and Open-Meteo are mocked or recorded.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            risk_engine/requirements*.txt
      - name: Install (one environment, as locally)
        run: |
          cd backend && pip install -r requirements-dev.txt && cd ..
          cd risk_engine && pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: mypy (core modules)
        run: |
          cd backend && mypy --config-file ../mypy.ini routing scoring geo clients api && cd ..
          cd risk_engine && mypy --config-file ../mypy.ini rules.py weather.py evaluate.py heatmap.py app.py
      - name: Shared schema tests
        run: cd shared && pytest -q
      - name: Risk engine tests (with coverage)
        run: cd risk_engine && pytest -q --cov=. --cov-report=term
      - name: Backend tests (with coverage)
        run: cd backend && pytest -q --cov=routing --cov=scoring --cov=geo --cov=clients --cov=api --cov-report=term

  frontend:
    name: Frontend (lint, format, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E + accessibility (Playwright, API mocked)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
